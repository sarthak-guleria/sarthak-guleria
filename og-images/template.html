<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    OG IMAGE TEMPLATE
    ─────────────────
    To generate a new og:image:
      1. Edit ARTICLE_TITLE below (leave empty for the default homepage image)
      2. Open in browser
      3. Open DevTools → device toolbar → set to exactly 1200 × 630
      4. Screenshot (⌘+Shift+4, or DevTools → "Capture screenshot")
      5. Save as a .png in /og-images/

    For the homepage / writing index:   leave ARTICLE_TITLE as ""
    For an article:                     set ARTICLE_TITLE to the article headline
  -->
  <script>
    const ARTICLE_TITLE = ""; // e.g. "What the Heck is Liquidity?"
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #faf8f5;
    }

    .card {
      width: 1200px;
      height: 630px;
      background: #faf8f5;
      border-left: 5px solid #2c5530;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 96px;
    }

    .top {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .name {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.01em;
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #888;
      font-weight: 400;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #e5e2dd;
      margin: 32px 0;
    }

    .article-title {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 52px;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.15;
      letter-spacing: -0.02em;
      max-width: 900px;
    }

    .article-title.is-default {
      font-size: 44px;
      font-style: italic;
      font-weight: 400;
      color: #4a4a4a;
      max-width: 780px;
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .url {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #888;
      font-weight: 400;
    }

    .tag {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2c5530;
      background: #e8f0e8;
      padding: 4px 10px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="name">Sarthak Guleria</div>
      <div class="tagline">Product &amp; Payments</div>
    </div>

    <div class="middle">
      <div class="divider"></div>
      <div class="article-title" id="title"></div>
    </div>

    <div class="bottom">
      <div class="url">sarthak-guleria.github.io</div>
      <div class="tag" id="tag"></div>
    </div>
  </div>

  <script>
    const titleEl = document.getElementById("title");
    const tagEl   = document.getElementById("tag");

    if (ARTICLE_TITLE) {
      titleEl.textContent = ARTICLE_TITLE;
      tagEl.textContent   = "Writing";
    } else {
      titleEl.textContent = "Product thinking, DeFi mechanics, and things figured out the hard way.";
      titleEl.classList.add("is-default");
      tagEl.textContent   = "sarthak-guleria.github.io";
      tagEl.style.display = "none";
      document.querySelector(".url").textContent = "";
    }
  </script>
</body>
</html>
